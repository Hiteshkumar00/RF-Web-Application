<p-dialog [(visible)]="visible" [modal]="true" [style]="{ width: '500px' }" [draggable]="false" [resizable]="false"
    [closable]="false" [closeOnEscape]="false" class="premium-dialog">

    <ng-template pTemplate="header">
        <div class="d-flex align-items-center justify-content-between w-100 pe-3">
            <span class="p-dialog-title m-0">{{ dialogTitle }}</span>
            <p-button icon="pi pi-times" [rounded]="true" [text]="true" severity="secondary" (onClick)="requestClose()"
                styleClass="p-0 transition-all hover:bg-gray-100" [style]="{ width: '2rem', height: '2rem' }" />
        </div>
    </ng-template>

    <form [formGroup]="form" class="pt-2" *ngIf="form">
        <div class="row g-3">
            <!-- From Account -->
            <div class="col-12">
                <div class="field mb-2">
                    <label for="fromPaymentAccountId" class="block mb-2 font-semibold">From Account</label>
                    <p-select id="fromPaymentAccountId" [options]="accountOptions" formControlName="fromPaymentAccountId"
                        optionLabel="label" optionValue="value" placeholder="Select Source Account"
                        styleClass="w-100 text-start" [filter]="true" appendTo="body" size="small" />
                    <p-message severity="error" text="Source account is required." size="small" variant="simple"
                        *ngIf="form.get('fromPaymentAccountId')?.touched && form.get('fromPaymentAccountId')?.invalid" />
                </div>
            </div>

            <!-- To Account -->
            <div class="col-12">
                <div class="field mb-2">
                    <label for="toPaymentAccountId" class="block mb-2 font-semibold">To Account</label>
                    <p-select id="toPaymentAccountId" [options]="accountOptions" formControlName="toPaymentAccountId"
                        optionLabel="label" optionValue="value" placeholder="Select Destination Account"
                        styleClass="w-100 text-start" [filter]="true" appendTo="body" size="small" />
                    <p-message severity="error" text="Destination account is required." size="small" variant="simple"
                        *ngIf="form.get('toPaymentAccountId')?.touched && form.get('toPaymentAccountId')?.invalid" />
                    
                    <!-- Same Account Validation -->
                    <p-message severity="error" text="Source and Destination accounts must be different." size="small" variant="simple"
                        *ngIf="form.hasError('sameAccount') && (form.get('fromPaymentAccountId')?.touched || form.get('toPaymentAccountId')?.touched)" />
                </div>
            </div>

            <!-- Amount -->
            <div class="col-md-6">
                <div class="field mb-2">
                    <label for="amount" class="block mb-2 font-semibold">Amount</label>
                    <p-inputNumber id="amount" formControlName="amount" mode="currency" currency="INR" locale="en-IN"
                        styleClass="w-100" placeholder="0.00" size="small" />
                    <p-message severity="error" text="Valid amount is required." size="small" variant="simple"
                        *ngIf="form.get('amount')?.touched && form.get('amount')?.invalid" />
                </div>
            </div>

            <!-- Date -->
            <div class="col-md-6">
                <div class="field mb-2">
                    <label for="date" class="block mb-2 font-semibold">Date</label>
                    <p-datepicker id="date" formControlName="date" [showIcon]="true" dateFormat="dd-mm-yy"
                        appendTo="body" styleClass="w-100" size="small" />
                    <p-message severity="error" text="Date is required." size="small" variant="simple"
                        *ngIf="form.get('date')?.touched && form.get('date')?.invalid" />
                </div>
            </div>

            <!-- Description -->
            <div class="col-12">
                <div class="field mb-1">
                    <label for="description" class="block mb-2 font-semibold">Description (Optional)</label>
                    <textarea id="description" pInputTextarea formControlName="description" rows="2"
                        class="w-100 p-inputtext-sm" style="resize: none" appVoiceTyping></textarea>
                </div>
            </div>
        </div>
    </form>

    <ng-template pTemplate="footer">
        <div class="d-flex gap-2 justify-content-end pt-2 mt-2" *ngIf="form">
            <p-button label="Cancel" icon="pi pi-times" severity="secondary" [text]="true" (onClick)="requestClose()" />
            <p-button *ngIf="mode !== 'view'" label="Save" icon="pi pi-check" (onClick)="onSubmit()"
                [disabled]="form.invalid" severity="primary" class="shadow-sm" />
        </div>
    </ng-template>
</p-dialog>
