<p-dialog [visible]="visible" [modal]="true" [style]="{ width: '500px' }" [draggable]="false" [resizable]="false"
    [closable]="false" [closeOnEscape]="false" class="premium-dialog">

    <ng-template pTemplate="header">
        <div class="d-flex align-items-center justify-content-between w-100 pe-3">
            <span class="p-dialog-title m-0">{{ dialogTitle }}</span>
            <p-button icon="pi pi-times" [rounded]="true" [text]="true" severity="secondary" (onClick)="close()"
                styleClass="p-0 transition-all hover:bg-gray-100" [style]="{ width: '2rem', height: '2rem' }" />
        </div>
    </ng-template>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="pt-2" *ngIf="form">
        <div class="row g-2">
            <div class="col-12">
                <div class="field">
                    <label for="productName" class="block mb-2 font-semibold">Product Name <span
                            class="text-danger">*</span></label>
                    <input id="productName" type="text" pInputText formControlName="productName"
                        class="w-100 p-inputtext-sm shadow-sm" placeholder="e.g. Sofa Set" appVoiceTyping />
                    <small class="text-danger"
                        *ngIf="form.get('productName')?.invalid && form.get('productName')?.touched">
                        Product name is required.
                    </small>
                </div>
            </div>

            <div class="col-12">
                <div class="field">
                    <label class="block mb-2 font-semibold">Default Warranty</label>
                    <div class="d-flex gap-2">
                        <div class="flex-grow-1">
                            <label class="extra-small text-muted mb-1 d-block">Years</label>
                            <p-inputNumber formControlName="warrantyYear" [min]="0" [max]="50" suffix="y"
                                inputStyleClass="w-100 text-center" styleClass="w-100" />
                        </div>
                        <div class="flex-grow-1">
                            <label class="extra-small text-muted mb-1 d-block">Months</label>
                            <p-inputNumber formControlName="warrantyMonth" [min]="0" [max]="11" suffix="m"
                                inputStyleClass="w-100 text-center" styleClass="w-100" />
                        </div>
                        <div class="flex-grow-1">
                            <label class="extra-small text-muted mb-1 d-block">Days</label>
                            <p-inputNumber formControlName="warrantyDay" [min]="0" [max]="31" suffix="d"
                                inputStyleClass="w-100 text-center" styleClass="w-100" />
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12">
                <div class="field">
                    <label for="imageLink" class="block mb-2 font-semibold">Image URL</label>
                    <input id="imageLink" type="text" pInputText formControlName="imageLink"
                        class="w-100 p-inputtext-sm shadow-sm" placeholder="https://example.com/image.jpg" />
                </div>
            </div>

            <div class="col-12 text-center" *ngIf="form.get('imageLink')?.value">
                <div class="preview-container p-2 border border-dashed rounded-3 bg-opacity-50">
                    <p-image [src]="form.get('imageLink')?.value" alt="Preview" [preview]="true"
                        [imageStyle]="{ 'max-width': '100%', 'max-height': '200px', 'object-fit': 'contain', 'border-radius': '8px' }"
                        styleClass="shadow-sm border rounded" />
                    <div class="mt-2 extra-small text-muted italic">Click image for full-screen preview</div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
            <p-button label="Cancel" icon="pi pi-times" [text]="true" severity="secondary" (onClick)="close()" />
            <p-button *ngIf="mode !== 'view'" type="submit" label="Save Product" icon="pi pi-check"
                severity="primary" />
        </div>
    </form>
</p-dialog>
