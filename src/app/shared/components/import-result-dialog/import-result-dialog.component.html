<div class="mb-3">
    <span class="font-bold text-lg text-green-600">Successfully Imported: {{ result.successCount }} rows</span>
</div>

<p-tabs value="0">
    <p-tablist>
        <p-tab value="0">Errors <p-badge [value]="result.errors.length.toString()" severity="danger"></p-badge></p-tab>
        <p-tab value="1">Warnings <p-badge [value]="result.warnings.length.toString()" severity="warn"></p-badge></p-tab>
    </p-tablist>
    
    <p-tabpanels>
        <p-tabpanel value="0">
            <div *ngIf="result.errors.length === 0" class="text-center py-4 text-500">
                No errors encountered.
            </div>
            <p-table *ngIf="result.errors.length > 0" [value]="result.errors" [paginator]="true" [rows]="10"
                styleClass="p-datatable-sm p-datatable-gridlines" responsiveLayout="scroll">
                <ng-template pTemplate="header">
                    <tr>
                        <th style="width: 5rem; text-align: center;">Row No</th>
                        <th>Error Message</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-item>
                    <tr>
                        <td style="text-align: center; font-weight: bold;">{{ item.rowNo }}</td>
                        <td class="text-red-500">{{ item.message }}</td>
                    </tr>
                </ng-template>
            </p-table>
        </p-tabpanel>
        
        <p-tabpanel value="1">
            <div *ngIf="result.warnings.length === 0" class="text-center py-4 text-500">
                No warnings generated.
            </div>
            <p-table *ngIf="result.warnings.length > 0" [value]="result.warnings" [paginator]="true" [rows]="10"
                styleClass="p-datatable-sm p-datatable-gridlines" responsiveLayout="scroll">
                <ng-template pTemplate="header">
                    <tr>
                        <th style="width: 5rem; text-align: center;">Row No</th>
                        <th>Warning Message</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-item>
                    <tr>
                        <td style="text-align: center; font-weight: bold;">{{ item.rowNo }}</td>
                        <td class="text-yellow-600">{{ item.message }}</td>
                    </tr>
                </ng-template>
            </p-table>
        </p-tabpanel>
    </p-tabpanels>
</p-tabs>

<div class="flex justify-content-end mt-4">
    <button pButton pRipple label="Close" icon="pi pi-times" class="p-button-text" (click)="close()"></button>
</div>
